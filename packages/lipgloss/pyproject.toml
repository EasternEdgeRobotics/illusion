[project]
name = "lipgloss"
version = "1.5.0"
description = "Label rendering and print queue service for illusion"
requires-python = ">=3.14"
dependencies = [
    "illusion-core",
    "niimprint",
    "pyserial>=3.5",
    "python-barcode>=0.16.1",
    "qrcode[pil]>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
