[project]
name = "claws"
version = "1.5.2"
description = "Inventory service for illusion"
requires-python = ">=3.14"
dependencies = [
    "illusion-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
claws = "claws.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
