[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
illusion-bot = { workspace = true }
illusion-kiosk = { workspace = true }
illusion-core = { workspace = true }
claws = { workspace = true }
lipgloss = { workspace = true }
niimprint = { git = "https://github.com/Peyton-C/niimprint" }

[dependency-groups]
dev = [
    "illusion-bot",
    "illusion-kiosk",
    "claws",
    "lipgloss",
    "illusion-core",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
# Each package has its own tests/ with clashing file names, which the default
# import mode cannot tell apart
addopts = ["--import-mode=importlib"]
# Raised inside anyio and starlette themselves, nothing here can act on them
filterwarnings = [
    "ignore:_pytest.python.CallSpec2:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
